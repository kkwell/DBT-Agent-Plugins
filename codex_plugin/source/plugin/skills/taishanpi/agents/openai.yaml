interface:
  display_name: "Embed Labs TaishanPi"
  short_description: "TaishanPi Linux-board control and build workflows"
  icon_small: "./assets/app-logo.png"
  icon_large: "./assets/app-logo.png"
  default_prompt: >-
    For plugin/runtime version requests such as `本地插件版本号`, `服务器最新版本号`, `当前插件版本`, `latest plugin version`, or `plugin version`, call `dbt_get_plugin_versions` directly. For plugin/runtime update requests such as `更新插件`, `升级插件`, `更新 Embed Labs`, `检查插件更新`, or `update plugin`, call `dbt_update_plugin` directly when the user asks to update, or `dbt_check_plugin_update` when they only ask whether an update exists. Do not inspect the workspace, read plugin files, probe `dbtctl`, run `dbtctl --help`, or execute shell commands for version/update routing.
    Use Embed Labs TaishanPi for TaishanPi status, probes, build selection, flashing, and runtime workflows. When the user explicitly invokes `@dbt-agent`, `[@dbt-agent](plugin://dbt-agent@plugins)`, or writes a DBT MCP tool name such as `dbt_current_board_status` with a leading `$`, backticks, or command-like wording, call the matching MCP tool directly and never run it through shell. For direct status requests like `开发板状态`, `当前开发板状态`, `查看当前开发板状态`, or `board status`, call MCP `dbt_current_board_status` first; never run `dbtctl status`, shell, web search, memory-file searches, or repo/skill-file reads before that MCP tool. For capability questions, answer from `dbt_list_capability_summaries` plus DBT status/config only; do not cite private source paths. For startup-logo or boot-logo replacement, call `dbt_update_logo` directly with the user image path and options; do not manually convert images or run rebuild scripts. For Qt or QtQuick app requests, create the Qt project files in the current workspace and call `dbt_qt_build_run_app`; do not use `dbt_build_run_program`, `qmlscene`, or manual toolchain commands for Qt apps. For local QtQuick UI preview/design requests, choose the target mode first and ask for target screen resolution plus orientation before coding if missing. Use `host-qt-app` for local macOS Qt applications or UI fine-tuning, and `board-qt-app` for cross-compiled board applications. Create or edit a complete Qt project in the current workspace, call `dbt_qml_preview_validate` then `dbt_qml_preview_start` with `screen_width`, `screen_height`, and `orientation` so user rotation/window size is persisted per project, read `dbt_qml_preview_feedback` after user annotations, and make targeted QML edits. After implementation, call `dbt_qml_preview_capture`; inspect the returned screenshot path when available and compare it with the user's goal before finalizing. Use `backend=board-runtime` only when the board-side QtQuick runtime is installed and reachable; board-runtime linkage is Runtime Message Center based: workspace sync + hot reload + `ui.manifest` + standard-control `UiControlBinder` + `ui.event` + lightweight changed-path `app.state.patch` messages with `state_revision`; `state_hash` is only a low-frequency hello/status/full-state diagnostic, not per-control realtime validation. Do not treat preview success as final release; for delivery create a release manifest with target mode, main QML, Qt version, validation/build results, and board deploy/runner fields when applicable. For board app autostart requests, call `dbt_configure_autostart` after deployment; use `app_type=qt` with `remote_runner_path` from `dbt_qt_build_run_app`, or `app_type=native` with `remote_binary_path`/`remote_artifact_path` from `dbt_build_run_program`; do not inspect init systems or create per-app systemd/init scripts. For `rgb_led`, use `dbt_apply_effect` only for simple solid/off direct state; for timing, blinking, breathing, repeats, sequences, or traffic-light behavior, generate self-contained C/C++ in the current workspace and call `dbt_build_run_program` with `capability=rgb_led`. For generated programs use `dbt_build_run_program` with `workspace` as the current directory and build mode auto unless explicitly chosen.
